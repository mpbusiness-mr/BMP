<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BMP · إعدادات المدرسة | School Settings</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="school-settings.css">
</head>

<body class="lang-ar">

    <div class="page-container">

        <header class="page-header">

            <div class="header-brand">
                <h1 data-i18n="pageTitle">School Settings</h1>
                <p data-i18n="pageSubtitle">Manage school information and settings.</p>
            </div>

            <div class="header-actions">

                <div class="lang-switcher" role="group" aria-label="Language">
                    <button type="button" class="lang-btn active" data-lang="ar" onclick="setLanguage('ar')">عربية</button>
                    <button type="button" class="lang-btn"        data-lang="fr" onclick="setLanguage('fr')">Français</button>
                    <button type="button" class="lang-btn"        data-lang="en" onclick="setLanguage('en')">English</button>
                </div>

                <button id="backButton" class="btn btn-secondary" data-i18n="back">
                    Back
                </button>

            </div>

        </header>


        <!-- School Information -->
        <section class="settings-card">

            <div class="card-header">
                <h2 data-i18n="schoolInformation">School Information</h2>
                <p data-i18n="schoolInformationSubtitle">Basic information about this school.</p>
            </div>

            <div class="form-grid">

                <div class="form-group">
                    <label for="institutionId" data-i18n="institutionId">Institution ID</label>
                    <input type="text" id="institutionId" readonly>
                </div>

                <div class="form-group">
                    <label for="schoolName" data-i18n="schoolName">School Name</label>
                    <input type="text" id="schoolName"
                           data-i18n-placeholder="schoolNamePlaceholder"
                           placeholder="School name">
                </div>

                <div class="form-group">
                    <label for="schoolPhone" data-i18n="phone">Phone</label>
                    <input type="text" id="schoolPhone"
                           data-i18n-placeholder="phonePlaceholder"
                           placeholder="School phone">
                </div>

                <div class="form-group">
                    <label for="schoolEmail" data-i18n="email">Email</label>
                    <input type="email" id="schoolEmail"
                           data-i18n-placeholder="emailPlaceholder"
                           placeholder="School email">
                </div>

            </div>

        </section>


        <!-- Academic Settings (hidden — will be re-enabled later) -->
        <section class="settings-card" id="academicSettingsSection" style="display: none;">

            <div class="card-header">
                <h2 data-i18n="academicSettings">Academic Settings</h2>
                <p data-i18n="academicSettingsSubtitle">Configure the current academic year.</p>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="academicYear" data-i18n="currentAcademicYear">Current Academic Year</label>
                    <input type="text" id="academicYear"
                           data-i18n-placeholder="academicYearPlaceholder"
                           placeholder="2026-27">
                </div>
            </div>

        </section>


        <!-- Password Change (hidden — will be built later) -->
        <section class="settings-card" id="passwordSettingsSection" style="display: none;">

            <div class="card-header">
                <h2 data-i18n="passwordSettings">Change Password</h2>
                <p data-i18n="passwordSettingsSubtitle">Update your account password.</p>
            </div>

            <div class="form-grid">

                <div class="form-group">
                    <label for="currentPassword" data-i18n="currentPassword">Current Password</label>
                    <input type="password" id="currentPassword" autocomplete="current-password"
                           data-i18n-placeholder="currentPasswordPlaceholder"
                           placeholder="Enter current password">
                </div>

                <div class="form-group">
                    <label for="newPassword" data-i18n="newPassword">New Password</label>
                    <input type="password" id="newPassword" autocomplete="new-password"
                           data-i18n-placeholder="newPasswordPlaceholder"
                           placeholder="Enter new password">
                </div>

                <div class="form-group">
                    <label for="confirmPassword" data-i18n="confirmPassword">Confirm New Password</label>
                    <input type="password" id="confirmPassword" autocomplete="new-password"
                           data-i18n-placeholder="confirmPasswordPlaceholder"
                           placeholder="Confirm new password">
                </div>

            </div>

        </section>


        <!-- Save -->
        <div class="actions">
            <button id="saveButton" class="btn btn-primary">
                <span class="btn-spinner" aria-hidden="true"></span>
                <span class="btn-label" data-i18n="saveSettings">Save Settings</span>
            </button>
        </div>

        <div id="message" class="message"></div>

    </div>

    <script src="js/auth.js"></script>
    <script src="js/school-settings.js"></script>

</body>

</html>
