<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BMP - Students</title>

    <link rel="stylesheet" href="students.css">
</head>

<body>

    <div class="page-container">

        <!-- Header -->

        <header class="page-header">

            <div>
                <h1 id="pageTitle" data-i18n="students">
                    Students
                </h1>

                <p id="pageSubtitle">
                    Manage school students
                </p>
            </div>

            <div class="header-actions">

                <div class="language-selector">

                    <label
                        for="languageSelect"
                        data-i18n="language">
                        Language
                    </label>

                    <select id="languageSelect">

                        <option value="en">
                            English
                        </option>

                        <option value="ar">
                            العربية
                        </option>

                        <option value="fr">
                            Français
                        </option>

                    </select>

                </div>


                <button
                    id="backButton"
                    class="btn btn-secondary"
                    data-i18n="back">

                    Back

                </button>


                <button
                    id="addStudentButton"
                    class="btn btn-primary"
                    data-i18n="addStudent">

                    + Add Student

                </button>

            </div>

        </header>


        <!-- School Summary -->

        <section class="school-summary">

            <div class="summary-item">

                <span
                    class="summary-label"
                    data-i18n="institutionId">

                    Institution ID

                </span>

                <strong id="institutionId">
                    -
                </strong>

            </div>


            <div class="summary-item">

                <span
                    class="summary-label"
                    data-i18n="school">

                    School

                </span>

                <strong id="institutionName">
                    -
                </strong>

            </div>


            <div class="summary-item">

                <span
                    class="summary-label"
                    data-i18n="studentsInSelectedYear">

                    Students in Selected Year

                </span>

                <strong id="totalStudents">
                    0
                </strong>

            </div>

        </section>


        <!-- Filters -->

        <section class="filters-card">

            <div class="filter-header">

                <div>

                    <h2 data-i18n="studentList">
                        Student List
                    </h2>

                    <p data-i18n="searchAndFilter">
                        Search and filter students
                    </p>

                </div>

            </div>


            <div class="filters-grid">


                <!-- Academic Year -->

                <div class="filter-group">

                    <label
                        for="academicYearFilter"
                        data-i18n="academicYear">

                        Academic Year

                    </label>

                    <select
                        id="academicYearFilter">

                        <option
                            value="all"
                            data-i18n="allAcademicYears">

                            All Academic Years

                        </option>

                    </select>

                </div>


                <!-- Search -->

                <div class="filter-group search-group">

                    <label
                        for="searchStudent"
                        data-i18n="search">

                        Search

                    </label>

                    <input
                        type="text"
                        id="searchStudent"
                        data-i18n-placeholder="searchPlaceholder"
                        placeholder="Search by name or student number...">

                </div>


                <!-- Stage -->

                <div class="filter-group">

                    <label
                        for="stageFilter"
                        data-i18n="stage">

                        Stage

                    </label>

                    <select
                        id="stageFilter">

                        <option
                            value="all"
                            data-i18n="allStages">

                            All Stages

                        </option>

                        <option
                            value="primary"
                            data-i18n="primary">

                            Primary

                        </option>

                        <option
                            value="preparatory"
                            data-i18n="preparatory">

                            Preparatory

                        </option>

                        <option
                            value="secondary"
                            data-i18n="secondary">

                            Secondary

                        </option>

                    </select>

                </div>


                <!-- Class -->

                <div class="filter-group">

                    <label
                        for="classFilter"
                        data-i18n="class">

                        Class

                    </label>

                    <select
                        id="classFilter">

                        <option
                            value="all"
                            data-i18n="allClasses">

                            All Classes

                        </option>

                    </select>

                </div>

            </div>

        </section>


        <!-- Students -->

        <section class="students-section">

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th data-i18n="studentNumber">
                                Student Number
                            </th>

                            <th data-i18n="studentName">
                                Student Name
                            </th>

                            <th data-i18n="academicYear">
                                Academic Year
                            </th>

                            <th data-i18n="stage">
                                Stage
                            </th>

                            <th data-i18n="class">
                                Class
                            </th>

                            <th data-i18n="registrationDate">
                                Registration Date
                            </th>

                            <th data-i18n="actions">
                                Actions
                            </th>

                        </tr>

                    </thead>

                    <tbody id="studentsTableBody">
                    </tbody>

                </table>

            </div>


            <!-- Empty State -->

            <div
                id="emptyState"
                class="empty-state">

                <div class="empty-icon">
                    +
                </div>

                <h3 data-i18n="noStudentsFound">
                    No Students Found
                </h3>

                <p data-i18n="noStudentsDescription">
                    There are no students matching
                    your search or filters.
                </p>

                <button
                    id="emptyAddStudentButton"
                    class="btn btn-primary"
                    data-i18n="addStudent">

                    + Add Student

                </button>

            </div>

        </section>

    </div>


    <script src="js/auth.js"></script>
    <script src="js/students.js"></script>

</body>

</html>
