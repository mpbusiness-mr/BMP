<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BMP · عقد تقديم خدمات</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="shortcut icon" type="image/png" href="logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary: #0f2b4b;
            --primary-light: #1a3f66;
            --accent: #00b4d8;
            --text-dark: #0b1a2a;
            --text-muted: #3e5a76;
            --line: #c8d3e0;
            --soft-line: #eaf0f7;
            --white: #ffffff;
            --paper-bg: #f4f7fb;
        }

        body {
            font-family: 'IBM Plex Sans Arabic', 'Inter', sans-serif;
            color: var(--text-dark);
            background: var(--paper-bg);
            line-height: 1.65;
            font-size: 12.5px;
            padding: 16px 0 60px;
        }

        body.lang-ar { font-family: 'IBM Plex Sans Arabic', sans-serif; }
        body.lang-fr,
        body.lang-en { font-family: 'Inter', sans-serif; }

        /* ---------- TOOLBAR ---------- */
        .toolbar {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 5%;
            background: rgba(255,255,255,0.94);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--line);
            gap: 14px;
            flex-wrap: wrap;
        }

        .bmp-logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            line-height: 1;
            text-decoration: none;
        }

        .bmp-logo-icon {
            position: relative;
            width: 36px;
            height: 36px;
            flex-shrink: 0;
        }

        .bmp-logo-icon .cube {
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 3px;
            transform: rotate(45deg) skew(-10deg, -10deg);
            box-shadow: 0 1px 2px rgba(0,0,0,0.08);
        }

        .bmp-logo-icon .cube-top {
            top: 0; left: 10px;
            background: linear-gradient(135deg, #00d4f5 0%, #00b4d8 100%);
        }
        .bmp-logo-icon .cube-left {
            top: 11px; left: 0;
            background: linear-gradient(135deg, #00b4d8 0%, #0091b3 100%);
        }
        .bmp-logo-icon .cube-right {
            top: 11px; left: 20px;
            background: linear-gradient(135deg, #0077b6 0%, #0f2b4b 100%);
        }

        .bmp-logo-text {
            font-family: 'Inter', sans-serif;
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #0f2b4b;
            text-transform: uppercase;
        }

        .toolbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .lang-switcher {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px;
            background: #f0f5fa;
            border: 1px solid #dbe4ee;
            border-radius: 40px;
        }

        .lang-btn {
            background: transparent;
            border: none;
            padding: 6px 14px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .lang-btn:hover { color: var(--primary); }

        .lang-btn.active {
            background: var(--primary);
            color: var(--white);
            box-shadow: 0 4px 10px rgba(15,43,75,0.2);
        }

        .print-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 20px;
            border: 1px solid transparent;
            border-radius: 12px;
            background: linear-gradient(145deg, #1a3f66, #0f2b4b);
            color: var(--white);
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px rgba(15,43,75,0.22);
        }

        .print-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 26px rgba(15,43,75,0.28);
        }

        /* ---------- PAGE ---------- */
        .contract-page {
            width: 100%;
            max-width: 820px;
            margin: 20px auto;
            padding: 0 14px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .contract-paper {
            background: var(--white);
            padding: 38px 44px 26px;
            box-shadow: 0 8px 32px rgba(15,43,75,0.08);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            min-height: 1000px;
        }

        /* ---------- HEADER ---------- */
        .doc-header {
            display: flex;
            align-items: center;
            gap: 18px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--primary);
            margin-bottom: 20px;
        }

        .doc-header .bmp-logo-icon { width: 50px; height: 50px; }
        .doc-header .bmp-logo-icon .cube { width: 22px; height: 22px; border-radius: 4px; }
        .doc-header .bmp-logo-icon .cube-top   { top: 0;   left: 14px; }
        .doc-header .bmp-logo-icon .cube-left  { top: 15px; left: 0; }
        .doc-header .bmp-logo-icon .cube-right { top: 15px; left: 28px; }
        .doc-header .bmp-logo-text { font-size: 1.85rem; }

        .doc-title h1 {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 2px;
        }

        .doc-subtitle {
            font-size: 0.88rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* ---------- META ---------- */
        .doc-meta {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 10px 14px;
            background: #f6fafd;
            border: 1px solid var(--line);
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.82rem;
            flex-wrap: wrap;
        }

        .meta-label {
            font-weight: 700;
            color: var(--text-muted);
            margin-inline-end: 6px;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 0.4px;
        }

        .meta-value {
            color: var(--primary);
            font-weight: 600;
            font-family: 'Inter', monospace;
        }

        /* ---------- SECTIONS ---------- */
        .section-num {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.98rem;
            font-weight: 700;
            color: var(--primary);
            padding: 6px 0;
            margin: 14px 0 8px;
            border-bottom: 1px solid var(--line);
        }

        .section-num .num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 26px;
            height: 26px;
            padding: 0 8px;
            background: var(--primary);
            color: var(--white);
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            font-family: 'Inter', monospace;
        }

        /* ---------- PARTY / INFO BLOCKS ---------- */
        .party-block {
            margin-bottom: 16px;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fbfdff;
        }

        .party-block h3 {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px dashed var(--line);
        }

        .info-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
        }

        .info-table tr + tr td,
        .info-table tr + tr th { border-top: 1px solid var(--soft-line); }

        .info-table th {
            text-align: start;
            padding: 6px 10px;
            width: 34%;
            font-weight: 600;
            color: var(--text-muted);
            background: #f4f8fc;
            vertical-align: middle;
        }

        .info-table td {
            padding: 6px 10px;
            color: var(--text-dark);
            font-weight: 500;
            vertical-align: middle;
        }

        /* ---------- FILL INPUTS ---------- */
        .fill-input {
            display: block;
            width: 100%;
            padding: 4px 2px;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 0.85rem;
            color: var(--primary);
            font-weight: 600;
            outline: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s ease;
        }

        .fill-input:focus {
            border-bottom-color: var(--accent);
        }

        /* Print: hidden if empty (border appears only when there is text) */
        @media print {
            .fill-input {
                border-bottom: none !important;
                padding: 2px 0;
                min-height: 18px;
            }
            .fill-input:empty {
                border-bottom: 1px solid #666 !important;
            }
        }

        /* ---------- TYPE CHOICES ---------- */
        .type-choices {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 22px;
            padding: 2px 0;
        }

        .type-choice {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-dark);
        }

        .type-choice .checkbox,
        .plan-choice .checkbox {
            display: inline-block;
            width: 15px;
            height: 15px;
            border: 1.5px solid var(--primary);
            border-radius: 3px;
            background: #fff;
            flex-shrink: 0;
        }

        /* ---------- PLAN CHOICES ---------- */
        .plan-choices {
            display: flex;
            gap: 36px;
            padding: 8px 0 12px;
            font-size: 0.9rem;
            flex-wrap: wrap;
        }

        .plan-choice {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            color: var(--primary);
        }

        .plan-table thead th {
            background: #e6f0fb;
            text-align: center;
        }
        .plan-table thead th:first-child { text-align: start; }
        .plan-table tbody td { text-align: center; }
        .plan-table tbody th { width: 32%; }

        .unit {
            color: var(--text-muted);
            font-size: 0.78rem;
            font-weight: 600;
            margin-inline-start: 4px;
        }

        /* ---------- CLAUSES ---------- */
        .clause {
            font-size: 0.86rem;
            line-height: 1.7;
            color: var(--text-dark);
            margin-bottom: 8px;
            text-align: justify;
        }

        .bullets {
            list-style: none;
            padding-inline-start: 18px;
            margin-bottom: 8px;
        }

        .bullets li {
            position: relative;
            font-size: 0.83rem;
            padding: 3px 0;
            line-height: 1.65;
            color: var(--text-dark);
        }

        .bullets li::before {
            content: "▪";
            color: var(--accent);
            position: absolute;
            inset-inline-start: -16px;
            font-weight: 700;
        }

        /* ---------- TERMS LINK BLOCK ---------- */
        .terms-box {
            padding: 12px 16px;
            border: 1px solid var(--line);
            border-inline-start: 4px solid var(--accent);
            border-radius: 8px;
            background: #fbfdff;
            margin: 10px 0 16px;
        }

        .terms-box p {
            font-size: 0.86rem;
            line-height: 1.7;
            color: var(--text-dark);
            margin-bottom: 6px;
        }

        .terms-box .terms-url {
            display: block;
            margin-top: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary);
            word-break: break-all;
            font-family: 'Inter', monospace;
        }

        /* ---------- PAGE FOOTER ---------- */
        .page-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            margin-top: auto;
            border-top: 1px solid var(--line);
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .page-num-right {
            font-family: 'Inter', monospace;
            font-weight: 600;
        }

        /* ---------- SIGNATURES ---------- */
        .signature-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-top: 18px;
        }

        .signature-block {
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 16px;
            background: #fbfdff;
        }

        .signature-block h3 {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--line);
            text-align: center;
        }

        .signature-line {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 0.8rem;
        }

        .line-label {
            min-width: 55px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.68rem;
            letter-spacing: 0.4px;
        }

        .blank-input {
            flex: 1;
            padding: 4px 2px;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 0.85rem;
            color: var(--primary);
            font-weight: 600;
            outline: none;
        }

        .signature-area { margin-top: 14px; }

        .area-label {
            display: block;
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 6px;
        }

        .area-box {
            height: 70px;
            border: 1px dashed #8a9bb0;
            border-radius: 6px;
            background: #ffffff;
        }

        /* ---------- FINAL NOTE ---------- */
        .final-note {
            margin-top: 12px;
            padding: 10px 14px;
            background: #f6fafd;
            border: 1px solid var(--line);
            border-radius: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.65;
        }

        /* ---------- PRINT ---------- */
        @media print {

            @page {
                size: A4;
                margin: 10mm 10mm;
            }

            html, body {
                background: #ffffff !important;
                padding: 0;
                margin: 0;
                font-size: 10.5px;
                line-height: 1.5;
            }

            .no-print, .toolbar { display: none !important; }

            .contract-page {
                max-width: none;
                margin: 0;
                padding: 0;
                gap: 0;
            }

            .contract-paper {
                box-shadow: none;
                border-radius: 0;
                padding: 0;
                margin: 0;
                min-height: auto;
                page-break-after: always;
                break-after: page;
            }

            .contract-paper:last-child {
                page-break-after: auto;
                break-after: auto;
            }

            .doc-header,
            .section-num,
            .party-block,
            .terms-box,
            .signature-block,
            .plan-choices,
            .plan-table {
                page-break-inside: avoid;
                break-inside: avoid;
            }

            .page-footer {
                position: absolute;
                bottom: 4mm;
                inset-inline: 10mm;
            }

            * {
                color: #000 !important;
                background: transparent !important;
                box-shadow: none !important;
                text-shadow: none !important;
            }

            .section-num .num {
                background: #eef2f7 !important;
                color: #000 !important;
                border: 1px solid #000 !important;
            }

            .terms-box {
                border: 1px solid #000 !important;
                background: #ffffff !important;
            }

            .area-box { border-color: #666 !important; }

            /* BMP logo solid navy in print */
            .bmp-logo-icon .cube {
                background: #0f2b4b !important;
                box-shadow: none !important;
            }
            .bmp-logo-text { color: #000 !important; }
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 700px) {
            .contract-paper { padding: 24px 20px 20px; min-height: auto; }

            .doc-header { flex-direction: column; text-align: center; gap: 10px; }
            .signature-grid { grid-template-columns: 1fr; }
            .doc-meta { flex-direction: column; gap: 6px; }
            .info-table th { width: 42%; font-size: 0.76rem; }
            .plan-choices { gap: 20px; }
            .lang-btn { padding: 5px 10px; font-size: 0.72rem; }
            .print-btn { padding: 8px 14px; font-size: 0.78rem; }
        }
    </style>
</head>
