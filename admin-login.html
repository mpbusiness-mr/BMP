<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Login - BMP</title>

    <link
        rel="stylesheet"
        href="admin-login.css">

</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <!-- Header -->

            <div class="login-header">

                <h1>
                    BMP
                </h1>

                <h2>
                    Admin Login
                </h2>

                <p>
                    Sign in to the Business Management Platform.
                </p>

            </div>


            <!-- Login Form -->

            <form
                id="loginForm">

                <div class="form-group">

                    <label
                        for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        autocomplete="username"
                        required>

                </div>


                <div class="form-group">

                    <label
                        for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required>

                </div>


                <button
                    type="submit"
                    id="loginButton"
                    class="btn btn-primary">

                    Login

                </button>


                <div
                    id="errorMessage"
                    class="error-message">
                </div>

            </form>

        </div>

    </div>


    <script src="js/admin-login.js"></script>

</body>

</html>
