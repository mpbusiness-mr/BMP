<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Institution - BMP Admin</title>

    <link rel="stylesheet" href="create-institution.css">
</head>
<body>

    <div class="page-container">

        <header class="page-header">
            <div>
                <h1>Create Institution</h1>
                <p>Create and configure a new institution</p>
            </div>
        </header>

        <main class="form-container">

            <!-- Institution Information -->
            <section class="form-section">
                <h2>Institution Information</h2>

                <div class="form-grid">

                    <div class="form-group">
                        <label for="institutionType">Institution Type</label>
                        <select id="institutionType">
                            <option value="">Select Type</option>
                            <option value="school">School</option>
                            <option value="restaurant">Restaurant</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="institutionId">Institution ID</label>
                        <input
                            type="text"
                            id="institutionId"
                            placeholder="Will be generated automatically"
                            readonly
                        >
                    </div>

                    <div class="form-group full-width">
                        <label for="institutionName">Institution Name</label>
                        <input
                            type="text"
                            id="institutionName"
                            placeholder="Enter institution name"
                        >
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter phone number"
                        >
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="Enter email address"
                        >
                    </div>

                </div>
            </section>


            <!-- License Information -->
            <section class="form-section">
                <h2>License Information</h2>

                <div class="form-grid">

                    <div class="form-group">
                        <label for="licenseStart">License Start Date</label>
                        <input type="date" id="licenseStart">
                    </div>

                    <div class="form-group">
                        <label for="licenseEnd">License End Date</label>
                        <input type="date" id="licenseEnd">
                    </div>

                </div>
            </section>


            <!-- Main Account -->
            <section class="form-section">
                <h2>Main Account</h2>

                <div class="form-grid">

                    <div class="form-group">
                        <label for="mainUsername">Main Username</label>
                        <input
                            type="text"
                            id="mainUsername"
                            placeholder="Enter main username"
                        >
                    </div>

                    <div class="form-group">
                        <label for="mainPassword">Main Password</label>
                        <input
                            type="password"
                            id="mainPassword"
                            placeholder="Enter main password"
                        >
                    </div>

                </div>
            </section>


            <!-- Actions -->
            <div class="form-actions">
                <button type="button" id="cancelButton" class="btn btn-secondary">
                    Cancel
                </button>

                <button type="button" id="createButton" class="btn btn-primary">
                    Create Institution
                </button>
            </div>

        </main>

    </div>

    <script src="js/activity-log.js"></script>
    <script src="js/create-institution.js"></script>
</body>
</html>
