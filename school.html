<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BMP - School Dashboard</title>

    <link rel="stylesheet" href="school.css">
</head>

<body>

    <div class="page-container">

        <!-- Header -->
        <header class="page-header">

            <div>
                <h1 id="schoolName">
                    School Dashboard
                </h1>

                <p id="schoolInfo">
                    Manage school operations
                </p>
            </div>


            <div class="header-actions">

                <div class="language-selector">

                    <label
                        for="languageSelect"
                        data-i18n="language">
                        Language
                    </label>

                    <select id="languageSelect">

                        <option value="en">
                            English
                        </option>

                        <option value="ar">
                            العربية
                        </option>

                        <option value="fr">
                            Français
                        </option>

                    </select>

                </div>


                <button
                    id="backButton"
                    class="btn btn-secondary"
                    data-i18n="back">

                    Back

                </button>

            </div>

        </header>


        <!-- School Information -->
        <section class="school-summary">

            <div class="summary-item">

                <span
                    class="summary-label"
                    data-i18n="institutionId">

                    Institution ID

                </span>

                <strong id="institutionId">
                    -
                </strong>

            </div>


            <div class="summary-item">

                <span
                    class="summary-label"
                    data-i18n="schoolNameLabel">

                    School Name

                </span>

                <strong id="institutionName">
                    -
                </strong>

            </div>


            <div class="summary-item">

                <span
                    class="summary-label"
                    data-i18n="status">

                    Status

                </span>

                <strong id="institutionStatus">
                    -
                </strong>

            </div>

        </section>


        <!-- Dashboard -->
        <main class="dashboard">

            <!-- Students -->
            <button
                id="studentsButton"
                class="dashboard-card">

                <h2 data-i18n="students">
                    Students
                </h2>

                <p data-i18n="studentsDescription">
                    Register, search and manage students.
                </p>

            </button>


            <!-- Payments -->
            <button
                id="paymentsButton"
                class="dashboard-card">

                <h2 data-i18n="payments">
                    Payments
                </h2>

                <p data-i18n="paymentsDescription">
                    Manage monthly student payments.
                </p>

            </button>


            <!-- Receipts -->
            <button style="display:none"
                id="receiptsButton"
                class="dashboard-card">

                <h2 data-i18n="receipts">
                    Receipts
                </h2>

                <p data-i18n="receiptsDescription">
                    View and manage payment receipts.
                </p>

            </button>


            <!-- Reports -->
            <button
                id="reportsButton"
                class="dashboard-card">

                <h2 data-i18n="reports">
                    Reports
                </h2>

                <p data-i18n="reportsDescription">
                    View school statistics and reports.
                </p>

            </button>


            <!-- Classes & Stages -->
            <button
                id="classesButton"
                class="dashboard-card">

                <h2 data-i18n="classesStages">
                    Classes &amp; Stages
                </h2>

                <p data-i18n="classesStagesDescription">
                    Manage academic stages and classes.
                </p>

            </button>


            <!-- Users -->
            <button
                id="usersButton"
                class="dashboard-card">

                <h2 data-i18n="users">
                    Users
                </h2>

                <p data-i18n="usersDescription">
                    Manage school users and access.
                </p>

            </button>


            <!-- Settings -->
            <button
                id="settingsButton"
                class="dashboard-card">

                <h2 data-i18n="settings">
                    Settings
                </h2>

                <p data-i18n="settingsDescription">
                    Manage school settings.
                </p>

            </button>


            <!-- Logout -->
            <button
                id="logoutButton"
                class="btn btn-danger"
                data-i18n="logout">

                Logout

            </button>

        </main>

    </div>


    <script src="js/auth.js"></script>
    <script src="js/school.js"></script>

</body>

</html>
