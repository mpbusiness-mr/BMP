<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BMP Admin Panel</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <div class="page-container">

        <!-- Header -->
        <header class="page-header">

            <div>
                <h1>BMP Admin Panel</h1>
                <p>Central administration and system management</p>
            </div>

        </header>


        <!-- Admin Actions -->
        <main class="admin-content">

            <section class="admin-card">

                <h2>Administration</h2>

                <p>
                    Manage institutions, users, licenses and system activity.
                </p>

                <div class="admin-actions">

                    <button
                        id="institutionsButton"
                        class="admin-btn">
                        Institutions
                    </button>

                    <button
                        id="activityLogsButton"
                        class="admin-btn">
                        Activity Logs
                    </button>

                    <button
                        id="logoutButton"
                        class="btn btn-danger">

                            Logout

                    </button>

                </div>

            </section>

        </main>

    </div>


    <script src="js/activity-log.js"></script>
    <script src="js/admin.js"></script>

</body>

</html>
