<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>School Settings - BMP</title>

    <link rel="stylesheet" href="school-settings.css">
</head>

<body>

    <div class="page-container">

        <!-- Header -->
        <header class="page-header">

            <div>
                <h1>
                    School Settings
                </h1>

                <p>
                    Manage school information and settings.
                </p>
            </div>

            <button
                id="backButton"
                class="btn btn-secondary">
                Back
            </button>

        </header>


        <!-- School Information -->
        <section class="settings-card">

            <div class="card-header">

                <h2>
                    School Information
                </h2>

                <p>
                    Basic information about this school.
                </p>

            </div>


            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Institution ID
                    </label>

                    <input
                        type="text"
                        id="institutionId"
                        readonly>

                </div>


                <div class="form-group">

                    <label>
                        School Name
                    </label>

                    <input
                        type="text"
                        id="schoolName"
                        placeholder="School name">

                </div>


                <div class="form-group">

                    <label>
                        Phone
                    </label>

                    <input
                        type="text"
                        id="schoolPhone"
                        placeholder="School phone">

                </div>


                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        id="schoolEmail"
                        placeholder="School email">

                </div>

            </div>

        </section>


        <!-- Academic Settings -->
        <section class="settings-card">

            <div class="card-header">

                <h2>
                    Academic Settings
                </h2>

                <p>
                    Configure the current academic year.
                </p>

            </div>


            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Current Academic Year
                    </label>

                    <input
                        type="text"
                        id="academicYear"
                        placeholder="2026-2027">

                </div>

            </div>

        </section>


        <!-- Payment Settings -->
        <section class="settings-card">

            <div class="card-header">

                <h2>
                    Payment Settings
                </h2>

                <p>
                    Configure basic school payment information.
                </p>

            </div>


            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Default Monthly Fee
                    </label>

                    <input
                        type="number"
                        id="monthlyFee"
                        min="0"
                        step="0.01"
                        placeholder="0">

                </div>


                <div class="form-group">

                    <label>
                        Currency
                    </label>

                    <input
                        type="text"
                        id="currency"
                        placeholder="MRU">

                </div>

            </div>

        </section>


        <!-- Save -->
        <div class="actions">

            <button
                id="saveButton"
                class="btn btn-primary">
                Save Settings
            </button>

        </div>


        <div
            id="message"
            class="message">
        </div>

    </div>

    <script src="js/auth.js"></script>
    <script src="js/school-settings.js"></script>

</body>

</html>
