<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BMP - School Login</title>

    <link
        rel="stylesheet"
        href="school-login.css">
</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <!-- Language Selector -->
            <div class="language-selector">

                <label for="languageSelect" data-i18n="language">
                    Language
                </label>

                <select id="languageSelect">
                    <option value="en">English</option>
                    <option value="ar">العربية</option>
                    <option value="fr">Français</option>
                </select>

            </div>


            <div class="login-header">

                <h1>BMP</h1>

                <h2 data-i18n="schoolLogin">
                    School Login
                </h2>

                <p data-i18n="loginDescription">
                    Sign in to your school account.
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label
                        for="username"
                        data-i18n="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        data-i18n-placeholder="usernamePlaceholder"
                        placeholder="Enter username"
                        autocomplete="username"
                        required>

                </div>


                <div class="form-group">

                    <label
                        for="password"
                        data-i18n="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        data-i18n-placeholder="passwordPlaceholder"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required>

                </div>


                <button
                    type="submit"
                    id="loginButton"
                    class="btn btn-primary"
                    data-i18n="login">

                    Login

                </button>


                <div
                    id="errorMessage"
                    class="error-message">
                </div>

            </form>

        </div>

    </div>


    <script src="js/school-login.js"></script>

</body>

</html>
