
<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMP - Add Student</title>
    <link rel="stylesheet" href="css/add-student.css">
</head>

<body>

    <header class="page-header">

        <div class="header-left">
            <h1 data-i18n="pageTitle">Add Student</h1>
            <p data-i18n="pageSubtitle">Register a new student</p>
        </div>

        <div class="header-right">

            <select
                id="languageSelect"
                aria-label="Language"
            >
                <option value="en">English</option>
                <option value="ar">العربية</option>
                <option value="fr">Français</option>
            </select>

            <button
                id="backButton"
                type="button"
                class="btn btn-secondary"
                data-i18n="back"
            >
                Back
            </button>

        </div>

    </header>

    <main class="page-container">

        <section class="card">

            <h2 data-i18n="schoolInformation">
                School Information
            </h2>

            <div class="info-grid">

                <div class="info-item">
                    <span data-i18n="institutionId">
                        Institution ID
                    </span>

                    <strong id="institutionId">—</strong>
                </div>

                <div class="info-item">
                    <span data-i18n="institutionName">
                        Institution Name
                    </span>

                    <strong id="institutionName">—</strong>
                </div>

            </div>

        </section>

        <section class="card">

            <h2 data-i18n="studentInformation">
                Student Information
            </h2>

            <form id="studentForm">

                <div class="form-grid">

                    <div class="form-group">

                        <label
                            for="academicYear"
                            data-i18n="academicYear"
                        >
                            Academic Year
                        </label>

                        <select
                            id="academicYear"
                            required
                        ></select>

                    </div>

                    <div class="form-group">

                        <label
                            for="studentNumber"
                            data-i18n="studentNumber"
                        >
                            Student Number
                        </label>

                        <input
                            type="text"
                            id="studentNumber"
                            readonly
                            placeholder="Generated automatically"
                            data-i18n-placeholder="generatedAutomatically"
                        >

                    </div>

                    <div class="form-group">

                        <label
                            for="studentName"
                            data-i18n="studentName"
                        >
                            Student Name
                        </label>

                        <input
                            type="text"
                            id="studentName"
                            required
                            autocomplete="off"
                            placeholder="Enter student name"
                            data-i18n-placeholder="enterStudentName"
                        >

                    </div>

                    <div class="form-group">

                        <label
                            for="stage"
                            data-i18n="stage"
                        >
                            Stage
                        </label>

                        <select
                            id="stage"
                            required
                        >

                            <option
                                value=""
                                data-i18n="selectStage"
                            >
                                Select Stage
                            </option>

                            <option
                                value="primary"
                                data-i18n="primary"
                            >
                                Primary
                            </option>

                            <option
                                value="preparatory"
                                data-i18n="preparatory"
                            >
                                Preparatory
                            </option>

                            <option
                                value="secondary"
                                data-i18n="secondary"
                            >
                                Secondary
                            </option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label
                            for="className"
                            data-i18n="class"
                        >
                            Class
                        </label>

                        <select
                            id="className"
                            required
                        >

                            <option
                                value=""
                                data-i18n="selectClass"
                            >
                                Select Class
                            </option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label
                            for="registrationDate"
                            data-i18n="registrationDate"
                        >
                            Registration Date
                        </label>

                        <input
                            type="date"
                            id="registrationDate"
                            required
                        >

                    </div>

                </div>

                <div class="form-actions">

                    <button
                        type="button"
                        id="cancelButton"
                        class="btn btn-secondary"
                        data-i18n="cancel"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        id="registerButton"
                        class="btn btn-primary"
                        data-i18n="registerStudent"
                    >
                        Register Student
                    </button>

                </div>

            </form>

        </section>

    </main>

    <script src="js/auth.js"></script>
    <script src="js/activity-log.js"></script>
    <script src="js/add-student.js"></script>

</body>

</html>
